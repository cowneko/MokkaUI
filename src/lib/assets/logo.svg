  <g transform="rotate(-28 50 50)">
    <ellipse cx="50" cy="50" rx="31" ry="22.5" fill="#F7EADA"/>
    <path d="M23 53 Q 37 37 50 50 T 77 47" stroke="#C85A26" stroke-width="7.5" stroke-linecap="round"/>
  </g>
</svg>
