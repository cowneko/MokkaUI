<svg width="512" height="512" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MokkaUI">
  <!-- MokkaUI: a coffee bean whose crease is a single graph edge. Tile #7A4F33 mocha,
       bean cream, crease copper. Reads from a 16 px taskbar dot to a 1024 px app icon. -->
